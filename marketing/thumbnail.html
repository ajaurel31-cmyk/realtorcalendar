<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thumbnail — Realtor Content Calendar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* Thumbnail: 600x600 — works for Gumroad grid + social sharing */
  .thumb {
    width: 600px;
    height: 600px;
    background: linear-gradient(135deg, #6366f1 0%, #7c3aed 50%, #9333ea 100%);
    font-family: 'Inter', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 60px;
    position: relative;
    overflow: hidden;
  }

  .thumb::before {
    content: '';
    position: absolute;
    top: -100px;
    right: -100px;
    width: 300px;
    height: 300px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
  }

  .thumb::after {
    content: '';
    position: absolute;
    bottom: -80px;
    left: -80px;
    width: 250px;
    height: 250px;
    background: rgba(255,255,255,0.04);
    border-radius: 50%;
  }

  .icon-wrap {
    width: 72px;
    height: 72px;
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    z-index: 1;
  }

  .icon-wrap svg {
    width: 36px;
    height: 36px;
    color: white;
  }

  h1 {
    font-size: 42px;
    font-weight: 900;
    color: white;
    line-height: 1.1;
    letter-spacing: -0.03em;
    margin-bottom: 16px;
    z-index: 1;
  }

  .sub {
    font-size: 16px;
    color: rgba(255,255,255,0.75);
    font-weight: 500;
    line-height: 1.5;
    max-width: 380px;
    margin-bottom: 32px;
    z-index: 1;
  }

  .pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 1;
  }

  .pill {
    display: flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    color: white;
    font-size: 12px;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 100px;
  }

  .pill-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .count {
    font-size: 13px;
    font-weight: 800;
    color: rgba(255,255,255,0.9);
    margin-top: 24px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="thumb">
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 2v4"/><path d="M16 2v4"/>
      <rect width="18" height="18" x="3" y="4" rx="2"/>
      <path d="M3 10h18"/>
      <path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/>
      <path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/>
    </svg>
  </div>

  <h1>Realtor Content Calendar</h1>

  <p class="sub">
    Generate a full month of social media posts for your real estate business — in seconds.
  </p>

  <div class="pills">
    <div class="pill"><div class="pill-dot" style="background:#4ade80"></div> Listings</div>
    <div class="pill"><div class="pill-dot" style="background:#60a5fa"></div> Educational</div>
    <div class="pill"><div class="pill-dot" style="background:#fbbf24"></div> Branding</div>
    <div class="pill"><div class="pill-dot" style="background:#c084fc"></div> Engagement</div>
  </div>

  <div class="count">214+ Post Templates</div>
</div>

</body>
</html>
